auth_backends.1 = oauth2
auth_mechanisms.1 = PLAIN

auth_oauth2.resource_server_id = $(RABBITMQ_RESOURCE_SERVER_ID)
auth_oauth2.jwks_uri = $(RABBITMQ_OAUTH_JWKS_URI)
auth_oauth2.algorithms.1 = RS256
auth_oauth2.verify_aud = true
auth_oauth2.require_exp = true
auth_oauth2.https.cacertfile = $(RABBITMQ_OAUTH_CA_FILE)
auth_oauth2.https.peer_verification = verify_peer
auth_oauth2.https.hostname_verification = wildcard

listeners.tcp = none
listeners.ssl.default = 5671
ssl_options.certfile = $(RABBITMQ_TLS_CERT_FILE)
ssl_options.keyfile = $(RABBITMQ_TLS_KEY_FILE)
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false

definitions.import_backend = local_filesystem
definitions.local.path = /etc/rabbitmq/definitions.json
