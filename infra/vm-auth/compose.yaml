name: smarttraffic-vm-auth

services:
  auth-server:
    image: smarttraffic/auth-server:local
    restart: unless-stopped
    network_mode: host
    user: "10001:10001"
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: "443"
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_KEY_STORE: /run/auth/tls/auth-server.p12
      SERVER_SSL_KEY_STORE_TYPE: PKCS12
      SERVER_SSL_KEY_STORE_PASSWORD: "${AUTH_TLS_KEYSTORE_PASSWORD:?Set AUTH_TLS_KEYSTORE_PASSWORD}"
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/run/auth/config/
      SMARTTRAFFIC_AUTH_ISSUER: "${AUTH_ISSUER_URI:?Set AUTH_ISSUER_URI}"
      SMARTTRAFFIC_AUTH_PRIVATE_KEY_PATH: /run/auth/signing/private.pem
      SMARTTRAFFIC_AUTH_PUBLIC_KEY_PATH: /run/auth/signing/public.pem
    volumes:
      - type: bind
        source: "${AUTH_TLS_DIR:?Set AUTH_TLS_DIR to a protected host directory}"
        target: /run/auth/tls
        read_only: true
      - type: bind
        source: "${AUTH_SIGNING_KEYS_DIR:?Set AUTH_SIGNING_KEYS_DIR to a protected host directory}"
        target: /run/auth/signing
        read_only: true
      - type: bind
        source: "${AUTH_RUNTIME_CONFIG_DIR:?Set AUTH_RUNTIME_CONFIG_DIR to a protected host directory}"
        target: /run/auth/config
        read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          cpus: "${AUTH_SERVER_CPUS:?Set AUTH_SERVER_CPUS after sizing}"
          memory: "${AUTH_SERVER_MEMORY:?Set AUTH_SERVER_MEMORY after sizing}"
