all:
  vars:
    ansible_user: ec2-user
    ansible_connection: ssh
    ansible_ssh_private_key_file: "{{ lookup('env', 'SMARTTRAFFIC_SSH_PRIVATE_KEY') }}"
    ansible_ssh_common_args: >-
      -o ProxyCommand="aws ssm start-session --target %h --document-name AWS-StartSSHSession --parameters portNumber=%p --region us-east-2"
      -o StrictHostKeyChecking=accept-new
    smarttraffic_aws_region: us-east-2
  children:
    smarttraffic:
      hosts:
        vm-auth:
          ansible_host: REPLACE_WITH_VM_AUTH_INSTANCE_ID
          smarttraffic_role: vm-auth
        vm-data:
          ansible_host: REPLACE_WITH_VM_DATA_INSTANCE_ID
          smarttraffic_role: vm-data
        vm-ingest:
          ansible_host: REPLACE_WITH_VM_INGEST_INSTANCE_ID
          smarttraffic_role: vm-ingest
        vm-core:
          ansible_host: REPLACE_WITH_VM_CORE_INSTANCE_ID
          smarttraffic_role: vm-core
        vm-app:
          ansible_host: REPLACE_WITH_VM_APP_INSTANCE_ID
          smarttraffic_role: vm-app
