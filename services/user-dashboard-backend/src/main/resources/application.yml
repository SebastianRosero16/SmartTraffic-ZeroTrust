server:
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax

spring:
  security:
    oauth2:
      client:
        registration:
          dashboard:
            provider: smarttraffic
            client-id: ${DASHBOARD_OAUTH_CLIENT_ID}
            client-secret: ${DASHBOARD_OAUTH_CLIENT_SECRET}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
            client-name: SmartTraffic
        provider:
          smarttraffic:
            issuer-uri: ${AUTH_ISSUER_URI}
